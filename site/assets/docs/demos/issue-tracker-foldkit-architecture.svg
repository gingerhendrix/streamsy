<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" width="920" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Issue tracker, Foldkit variant architecture</title>
  <desc id="desc">In the browser, the Foldkit runtime runs one loop. The view turns a click or a key press into a Message. The pure update function takes the Model and the Message and returns a new Model and Commands. Commands make the stamp and post the write with a txid, and they return a result Message. A subscription reads the workspace State stream with the Durable Streams client and turns each batch into a ReceivedStateBatch Message. Vite with the Foldkit plugin serves the page and proxies /api and /streams to the base app's Bun server. There, the HttpApi handler calls IssueTracker.mutate, which appends to the workspace stream, and Serve.mount serves the stream read-only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .link { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Issue tracker, Foldkit</text>
  <text class="caption" x="24" y="60">One loop in the browser. The server is the base app's server. The teal box is the Streamsy stream.</text>

  <!-- Browser group: the Foldkit runtime -->
  <rect class="group" x="20" y="80" width="880" height="270" rx="18"/>
  <text class="group-label" x="36" y="102">BROWSER: FOLDKIT RUNTIME</text>

  <rect class="node" x="40" y="130" width="180" height="90" rx="14"/>
  <text class="node-title" x="130" y="170" text-anchor="middle">view</text>
  <text class="node-subtitle" x="130" y="190" text-anchor="middle">pending overlay, counts</text>

  <rect class="node" x="260" y="130" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="170" text-anchor="middle">Model</text>
  <text class="node-subtitle" x="350" y="190" text-anchor="middle">rows, pending</text>

  <rect class="node" x="480" y="130" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="170" text-anchor="middle">update</text>
  <text class="node-subtitle" x="570" y="190" text-anchor="middle">pure: Model, Commands</text>

  <rect class="node" x="700" y="130" width="180" height="90" rx="14"/>
  <text class="node-title" x="790" y="170" text-anchor="middle">Subscription</text>
  <text class="node-subtitle" x="790" y="190" text-anchor="middle">stream(), live</text>

  <rect class="node" x="480" y="252" width="180" height="80" rx="14"/>
  <text class="node-title" x="570" y="288" text-anchor="middle">Commands</text>
  <text class="node-subtitle" x="570" y="308" text-anchor="middle">GenerateStamp, SendWrite</text>

  <path class="flow" d="M 698 175 H 664"/>
  <path class="flow" d="M 478 175 H 444"/>
  <path class="flow" d="M 258 175 H 224"/>
  <path class="flow" d="M 130 128 V 116 H 570 V 124"/>
  <text class="flow-label" x="300" y="111">Message</text>
  <path class="flow" d="M 545 222 V 248"/>
  <path class="flow" d="M 595 250 V 226"/>
  <text class="flow-label" x="604" y="243">Message</text>

  <!-- Vite dev server -->
  <rect class="host" x="20" y="380" width="880" height="56" rx="14"/>
  <text class="node-title" x="250" y="404" text-anchor="middle">Vite, @foldkit/vite-plugin</text>
  <text class="node-subtitle" x="250" y="423" text-anchor="middle">serves the page, proxies /api and /streams</text>

  <!-- Server group: the base app's server, unchanged -->
  <rect class="group" x="20" y="466" width="880" height="232" rx="18"/>
  <text class="group-label" x="36" y="488">BASE APP SERVER (BUN, UNCHANGED)</text>

  <rect class="node" x="260" y="504" width="180" height="84" rx="14"/>
  <text class="node-title" x="350" y="540" text-anchor="middle">IssueTracker</text>
  <text class="node-subtitle" x="350" y="560" text-anchor="middle">read, fold, append</text>

  <rect class="node" x="480" y="504" width="180" height="84" rx="14"/>
  <text class="node-title" x="570" y="540" text-anchor="middle">HttpApi handler</text>
  <text class="node-subtitle" x="570" y="560" text-anchor="middle">POST /api/w/:ws/…</text>

  <rect class="node" x="700" y="504" width="180" height="84" rx="14"/>
  <text class="node-title" x="790" y="540" text-anchor="middle">Serve.mount</text>
  <text class="node-subtitle" x="790" y="560" text-anchor="middle">GET, HEAD only</text>

  <rect class="stream" x="260" y="616" width="620" height="64" rx="14"/>
  <text class="node-title" x="570" y="643" text-anchor="middle">Workspace stream</text>
  <text class="node-subtitle" x="570" y="663" text-anchor="middle">workspace/:workspaceId, memory or Bun SQLite</text>

  <path class="flow" d="M 570 334 V 500"/>
  <text class="flow-label" x="482" y="456">POST + txid</text>
  <path class="flow" d="M 790 502 V 224"/>
  <text class="flow-label" x="800" y="456">GET live</text>
  <path class="flow" d="M 478 546 H 444"/>
  <path class="flow" d="M 350 590 V 612"/>
  <path class="flow" d="M 790 614 V 592"/>

  <!-- Step badges: each number is also a section number on the page -->
  <circle class="badge" cx="420" cy="130" r="11"/><text class="step" x="420" y="134" text-anchor="middle">1</text>
  <circle class="badge" cx="490" cy="116" r="11"/><text class="step" x="490" y="120" text-anchor="middle">2</text>
  <circle class="badge" cx="268" cy="98" r="11"/><text class="step" x="268" y="102" text-anchor="middle">3</text>
  <circle class="badge" cx="860" cy="130" r="11"/><text class="step" x="860" y="134" text-anchor="middle">4</text>
  <circle class="badge" cx="640" cy="130" r="11"/><text class="step" x="640" y="134" text-anchor="middle">5</text>
  <circle class="badge" cx="640" cy="332" r="11"/><text class="step" x="640" y="336" text-anchor="middle">6</text>
  <circle class="badge" cx="200" cy="130" r="11"/><text class="step" x="200" y="134" text-anchor="middle">7</text>
  <circle class="badge" cx="460" cy="380" r="11"/><text class="step" x="460" y="384" text-anchor="middle">8</text>

  <text class="legend" x="24" y="738">1. The Model holds the rows</text>
  <text class="legend" x="318" y="738">2. Messages name what happened</text>
  <text class="legend" x="612" y="738">3. Start the runtime</text>
  <text class="legend" x="24" y="760">4. Stream reads become Messages</text>
  <text class="legend" x="318" y="760">5. Fold the batch in update</text>
  <text class="legend" x="612" y="760">6. Write first, then wait for the txid</text>
  <text class="legend" x="24" y="782">7. Render pending rows and derived lists</text>
  <text class="legend" x="318" y="782">8. Serve through Vite</text>
</svg>

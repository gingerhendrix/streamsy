<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" width="920" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Issue tracker demo architecture</title>
  <desc id="desc">In the browser, an action inserts the change into TanStack DB and posts it with a txid to the JSON API. An HttpApi handler calls IssueTracker.mutate, which reads and folds the workspace stream, then appends the change only if the stream tail has not moved. The stream lives in a memory or Bun SQLite store. Http.routes serves the stream read-only from the same Effect router. createStreamDB follows the stream, confirms the txid and fills the TanStack DB collections that React reads with useLiveQuery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .link { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Issue tracker</text>
  <text class="caption" x="24" y="60">Write through the JSON API, read from the stream. The teal box is the Streamsy stream.</text>

  <!-- Browser group -->
  <rect class="group" x="20" y="80" width="880" height="150" rx="18"/>
  <text class="group-label" x="36" y="102">BROWSER</text>

  <rect class="node" x="40" y="116" width="180" height="90" rx="14"/>
  <text class="node-title" x="130" y="156" text-anchor="middle">Actions</text>
  <text class="node-subtitle" x="130" y="176" text-anchor="middle">insert, then POST</text>

  <rect class="node" x="260" y="116" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="156" text-anchor="middle">React</text>
  <text class="node-subtitle" x="350" y="176" text-anchor="middle">useLiveQuery</text>

  <rect class="node" x="480" y="116" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="156" text-anchor="middle">TanStack DB</text>
  <text class="node-subtitle" x="570" y="176" text-anchor="middle">3 collections</text>

  <rect class="node" x="700" y="116" width="180" height="90" rx="14"/>
  <text class="node-title" x="790" y="156" text-anchor="middle">createStreamDB</text>
  <text class="node-subtitle" x="790" y="176" text-anchor="middle">follow, awaitTxId</text>

  <path class="flow" d="M 258 161 H 224"/>
  <path class="flow" d="M 478 161 H 444"/>
  <path class="flow" d="M 698 161 H 664"/>

  <!-- Server group -->
  <rect class="group" x="20" y="262" width="880" height="240" rx="18"/>
  <text class="group-label" x="36" y="284">BUN SERVER</text>

  <rect class="node" x="40" y="300" width="180" height="88" rx="14"/>
  <text class="node-title" x="130" y="338" text-anchor="middle">HttpApi handler</text>
  <text class="node-subtitle" x="130" y="358" text-anchor="middle">POST /api/w/:ws/…</text>

  <rect class="node" x="260" y="300" width="180" height="88" rx="14"/>
  <text class="node-title" x="350" y="338" text-anchor="middle">IssueTracker</text>
  <text class="node-subtitle" x="350" y="358" text-anchor="middle">mutate: read, fold,</text>
  <text class="node-subtitle" x="350" y="373" text-anchor="middle">append</text>

  <rect class="stream" x="480" y="300" width="180" height="88" rx="14"/>
  <text class="node-title" x="570" y="338" text-anchor="middle">Workspace stream</text>
  <text class="node-subtitle" x="570" y="358" text-anchor="middle">workspace/:workspaceId</text>

  <rect class="node" x="700" y="300" width="180" height="88" rx="14"/>
  <text class="node-title" x="790" y="338" text-anchor="middle">Http.routes</text>
  <text class="node-subtitle" x="790" y="358" text-anchor="middle">access: "read"</text>

  <rect class="host" x="40" y="418" width="620" height="66" rx="14"/>
  <text class="node-title" x="350" y="446" text-anchor="middle">Memory or Bun SQLite store</text>
  <text class="node-subtitle" x="350" y="466" text-anchor="middle">StorageLive: Streamsy.group(Workspaces)</text>

  <path class="flow" d="M 180 208 V 296"/>
  <text class="flow-label" x="136" y="255">txid</text>
  <path class="flow" d="M 222 344 H 256"/>
  <path class="flow" d="M 442 326 H 476"/>
  <path class="flow" d="M 478 362 H 446"/>
  <path class="flow" d="M 662 344 H 696"/>
  <path class="flow" d="M 790 298 V 210"/>
  <path class="link" d="M 570 390 V 416"/>

  <!-- Step badges: each number is also a section number on the page -->
  <circle class="badge" cx="640" cy="300" r="11"/><text class="step" x="640" y="304" text-anchor="middle">1</text>
  <circle class="badge" cx="640" cy="418" r="11"/><text class="step" x="640" y="422" text-anchor="middle">2</text>
  <circle class="badge" cx="202" cy="251" r="11"/><text class="step" x="202" y="255" text-anchor="middle">3</text>
  <circle class="badge" cx="200" cy="300" r="11"/><text class="step" x="200" y="304" text-anchor="middle">4</text>
  <circle class="badge" cx="420" cy="300" r="11"/><text class="step" x="420" y="304" text-anchor="middle">5</text>
  <circle class="badge" cx="812" cy="251" r="11"/><text class="step" x="812" y="255" text-anchor="middle">6</text>
  <circle class="badge" cx="681" cy="140" r="11"/><text class="step" x="681" y="144" text-anchor="middle">7</text>

  <text class="legend" x="24" y="540">1. Declare the workspace stream</text>
  <text class="legend" x="318" y="540">2. Build the storage and boot</text>
  <text class="legend" x="612" y="540">3. Write locally, POST with a txid</text>
  <text class="legend" x="24" y="562">4. Decode the request in HttpApi</text>
  <text class="legend" x="318" y="562">5. Read, fold, append</text>
  <text class="legend" x="612" y="562">6. Serve the stream read-only</text>
  <text class="legend" x="24" y="584">7. Follow the stream and confirm the txid</text>
</svg>

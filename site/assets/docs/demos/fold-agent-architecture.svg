<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" width="920" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Fold agent architecture</title>
  <desc id="desc">Two processes open the same agent session. In each process a Fold session writes through a Streamsy event log adapter. Both adapters append to one session stream in a memory or Bun SQLite store. Each append names the tail that its writer read with expectedOffset. When process B appends first, the next append from process A fails and process A is fenced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .link { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Fold agent</text>
  <text class="caption" x="24" y="60">One session, one stream. Each append names the tail it read. The teal box is the Streamsy stream.</text>

  <!-- Process A -->
  <rect class="group" x="20" y="80" width="560" height="130" rx="18"/>
  <text class="group-label" x="36" y="100">PROCESS A</text>
  <rect class="node" x="40" y="110" width="180" height="84" rx="14"/>
  <text class="node-title" x="130" y="147" text-anchor="middle">Fold session</text>
  <text class="node-subtitle" x="130" y="167" text-anchor="middle">agent loop</text>
  <rect class="node" x="260" y="110" width="180" height="84" rx="14"/>
  <text class="node-title" x="350" y="147" text-anchor="middle">Event log</text>
  <text class="node-subtitle" x="350" y="167" text-anchor="middle">tail, nextEntrySeq</text>

  <!-- Process B -->
  <rect class="group" x="20" y="230" width="560" height="130" rx="18"/>
  <text class="group-label" x="36" y="250">PROCESS B</text>
  <rect class="node" x="40" y="260" width="180" height="84" rx="14"/>
  <text class="node-title" x="130" y="297" text-anchor="middle">Fold session</text>
  <text class="node-subtitle" x="130" y="317" text-anchor="middle">resume</text>
  <rect class="node" x="260" y="260" width="180" height="84" rx="14"/>
  <text class="node-title" x="350" y="297" text-anchor="middle">Event log</text>
  <text class="node-subtitle" x="350" y="317" text-anchor="middle">tail, nextEntrySeq</text>

  <!-- Store -->
  <rect class="stream" x="640" y="130" width="240" height="90" rx="14"/>
  <text class="node-title" x="760" y="170" text-anchor="middle">Session stream</text>
  <text class="node-subtitle" x="760" y="190" text-anchor="middle">fold/sessions/:id/events</text>
  <rect class="host" x="640" y="280" width="240" height="64" rx="14"/>
  <text class="node-title" x="760" y="308" text-anchor="middle">Memory or Bun SQLite</text>
  <text class="node-subtitle" x="760" y="328" text-anchor="middle">openStore</text>

  <path class="flow" d="M 222 152 H 256"/>
  <path class="flow" d="M 222 302 H 256"/>
  <path class="flow" d="M 442 152 H 540 V 162 H 636"/>
  <path class="flow" d="M 442 302 H 540 V 192 H 636"/>
  <text class="flow-label" x="610" y="120" text-anchor="end">expectedOffset: tail</text>
  <path class="link" d="M 760 222 V 278"/>

  <!-- Step badges: each number is also a section number -->
  <circle class="badge" cx="880" cy="130" r="11"/><text class="step" x="880" y="134" text-anchor="middle">1</text>
  <circle class="badge" cx="880" cy="280" r="11"/><text class="step" x="880" y="284" text-anchor="middle">2</text>
  <circle class="badge" cx="220" cy="110" r="11"/><text class="step" x="220" y="114" text-anchor="middle">3</text>
  <circle class="badge" cx="440" cy="110" r="11"/><text class="step" x="440" y="114" text-anchor="middle">4</text>
  <circle class="badge" cx="540" cy="140" r="11"/><text class="step" x="540" y="144" text-anchor="middle">5</text>
  <circle class="badge" cx="440" cy="260" r="11"/><text class="step" x="440" y="264" text-anchor="middle">6</text>

  <text class="legend" x="24" y="394">1. Declare the session stream</text>
  <text class="legend" x="318" y="394">2. Open a memory or SQLite store</text>
  <text class="legend" x="612" y="394">3. Give Fold the Streamsy log</text>
  <text class="legend" x="24" y="416">4. Open the writer at the tail</text>
  <text class="legend" x="318" y="416">5. Append with expectedOffset</text>
  <text class="legend" x="612" y="416">6. A second writer fences the first</text>
</svg>

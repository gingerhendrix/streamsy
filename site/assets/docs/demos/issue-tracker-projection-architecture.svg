<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 690" width="920" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Issue tracker projection architecture</title>
  <desc id="desc">A client posts a command to the API route. transact reads and folds the issue events stream, then appends one fact with expectedOffset. Five input streams hold issue facts, label facts and three catalogs. The issueRows projection writes SQLite application tables. The tracker projection writes three output streams and a private state value. The command path and the watchers run both projections. Serve routes publish the output streams, the summary and the read-only input streams to clients.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .trigger { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Issue tracker projection</text>
  <text class="caption" x="24" y="60">Commands append facts. Two projections read five inputs. Teal boxes are Streamsy streams.</text>

  <rect class="group" x="20" y="80" width="880" height="530" rx="18"/>
  <text class="group-label" x="36" y="100">BUN SERVER, ONE SQLITE FILE</text>

  <!-- Row A -->
  <rect class="node" x="40" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="130" y="150" text-anchor="middle">API route</text>
  <text class="node-subtitle" x="130" y="170" text-anchor="middle">POST …/commands</text>

  <rect class="node" x="260" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="150" text-anchor="middle">transact</text>
  <text class="node-subtitle" x="350" y="170" text-anchor="middle">expectedOffset</text>

  <rect class="stream" x="480" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="150" text-anchor="middle">5 input streams</text>
  <text class="node-subtitle" x="570" y="170" text-anchor="middle">facts and catalogs</text>

  <!-- Row B -->
  <rect class="node" x="260" y="250" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="290" text-anchor="middle">issueRows</text>
  <text class="node-subtitle" x="350" y="310" text-anchor="middle">Projection.atomic</text>

  <rect class="node" x="480" y="250" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="290" text-anchor="middle">Triggers</text>
  <text class="node-subtitle" x="570" y="310" text-anchor="middle">run, then watch</text>

  <rect class="node" x="700" y="250" width="180" height="90" rx="14"/>
  <text class="node-title" x="790" y="290" text-anchor="middle">tracker</text>
  <text class="node-subtitle" x="790" y="310" text-anchor="middle">Projection.outputs</text>

  <!-- Row C -->
  <rect class="host" x="260" y="390" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="430" text-anchor="middle">App tables</text>
  <text class="node-subtitle" x="350" y="450" text-anchor="middle">issues, labels, …</text>

  <rect class="stream" x="700" y="390" width="180" height="90" rx="14"/>
  <text class="node-title" x="790" y="430" text-anchor="middle">Output streams</text>
  <text class="node-subtitle" x="790" y="450" text-anchor="middle">board, counts, feed</text>

  <!-- Row D -->
  <rect class="node" x="40" y="505" width="180" height="90" rx="14"/>
  <text class="node-title" x="130" y="545" text-anchor="middle">Clients</text>
  <text class="node-subtitle" x="130" y="565" text-anchor="middle">curl, scripts</text>

  <rect class="node" x="480" y="505" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="545" text-anchor="middle">Serve routes</text>
  <text class="node-subtitle" x="570" y="565" text-anchor="middle">read-only</text>

  <!-- Flows -->
  <path class="flow" d="M 130 503 V 206"/>
  <path class="flow" d="M 222 155 H 254"/>
  <path class="flow" d="M 442 155 H 474"/>
  <path class="flow" d="M 520 202 V 224 H 350 V 244"/>
  <path class="flow" d="M 620 202 V 224 H 790 V 244"/>
  <path class="trigger" d="M 478 295 H 446"/>
  <path class="trigger" d="M 662 295 H 694"/>
  <path class="flow" d="M 350 342 V 384"/>
  <path class="flow" d="M 790 342 V 384"/>
  <path class="flow" d="M 790 482 V 550 H 666"/>
  <path class="flow" d="M 478 550 H 226"/>
  <text class="flow-label" x="352" y="540" text-anchor="middle">GET</text>

  <!-- Step badges: each number is also a section number -->
  <circle class="badge" cx="660" cy="110" r="11"/><text class="step" x="660" y="114" text-anchor="middle">1</text>
  <circle class="badge" cx="440" cy="110" r="11"/><text class="step" x="440" y="114" text-anchor="middle">2</text>
  <circle class="badge" cx="440" cy="250" r="11"/><text class="step" x="440" y="254" text-anchor="middle">3</text>
  <circle class="badge" cx="880" cy="250" r="11"/><text class="step" x="880" y="254" text-anchor="middle">4</text>
  <circle class="badge" cx="660" cy="250" r="11"/><text class="step" x="660" y="254" text-anchor="middle">5</text>
  <circle class="badge" cx="660" cy="505" r="11"/><text class="step" x="660" y="509" text-anchor="middle">6</text>

  <text class="legend" x="24" y="640">1. Declare the input streams</text>
  <text class="legend" x="318" y="640">2. Append a command with expectedOffset</text>
  <text class="legend" x="612" y="640">3. Write SQL rows with issueRows</text>
  <text class="legend" x="24" y="662">4. Write output streams with tracker</text>
  <text class="legend" x="318" y="662">5. Run both on commands and changes</text>
  <text class="legend" x="612" y="662">6. Serve the results read-only</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 904" width="920" height="904" role="img" aria-labelledby="title desc">
  <title id="title">Doom on Cloudflare architecture</title>
  <desc id="desc">Three Durable Object classes sit behind a Cloudflare Worker that routes public requests with Placement.byRoute and rejects internal /__ paths. The browser's Play page appends binary input batches to the DoomGames object for the game's family. That object holds the Sessions stream for the parent session and its forks, plus the Batches manifest. Each Sessions append runs the frameWake projection, which appends to the ReplayWake stream in the DoomReplay object for that session over the internal /__wake link. The wake sets an alarm that runs the replayStats projection. replayStats reads frames from DoomGames over /__frames, steps a headless WASM engine and appends score rows to the Scores stream in the DoomLobby object over /__scores. Every 21,000 tics replayStats also writes a gzip snapshot of engine memory to the server_snapshots SQLite table in the same DoomReplay object. The Worker forwards GET and HEAD requests for /doom/v2/server-snapshots to that object. DoomLobby also holds LobbyStream, which the browser writes session metadata to. The Watch page reads frames to replay and fork, reads server snapshots to seek, and reads Scores for its HUD. The Lobby page follows LobbyStream and Scores over HTTP catch-up and then a WebSocket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .owner { fill: #94a3b8; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .inner-title { fill: #f8fafc; font: 700 14px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .table { fill: #4b4561; stroke: #a59cc4; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .both { fill: none; stroke: #64748b; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .trigger { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Doom on Cloudflare</text>
  <text class="caption" x="24" y="60">Inputs flow up into the family object. Stats come back down through the lobby.</text>

  <!-- Key -->
  <rect class="stream" x="676" y="89" width="30" height="14" rx="4"/>
  <text class="legend" x="718" y="100">Streamsy stream</text>
  <path class="flow" d="M 676 118 H 700"/>
  <text class="legend" x="718" y="122">Data</text>
  <path class="trigger" d="M 676 140 H 700"/>
  <text class="legend" x="718" y="144">Wakeup</text>
  <rect class="table" x="676" y="155" width="30" height="14" rx="4"/>
  <text class="legend" x="718" y="166">SQLite table</text>
  <text class="flow-label" x="676" y="188">/__…</text>
  <text class="legend" x="718" y="188">Internal link, not public</text>

  <!-- DoomGames: one object per family -->
  <rect class="group" x="20" y="84" width="240" height="340" rx="18"/>
  <text class="group-label" x="36" y="108">DOOMGAMES</text>
  <text class="owner" x="244" y="108" text-anchor="end">game:&lt;family&gt;</text>

  <rect class="node" x="36" y="128" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="156" text-anchor="middle">frameWake</text>
  <text class="node-subtitle" x="140" y="175" text-anchor="middle">Projection.wake</text>

  <rect class="stream" x="42" y="238" width="208" height="64" rx="14"/>
  <rect class="stream" x="36" y="244" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="272" text-anchor="middle">Sessions</text>
  <text class="node-subtitle" x="140" y="291" text-anchor="middle">bytes · parent + forks</text>

  <rect class="stream" x="36" y="336" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="364" text-anchor="middle">Batches</text>
  <text class="node-subtitle" x="140" y="383" text-anchor="middle">json · batch manifest</text>

  <!-- DoomReplay: one object per session -->
  <rect class="group" x="340" y="84" width="240" height="432" rx="18"/>
  <text class="group-label" x="356" y="108">DOOMREPLAY</text>
  <text class="owner" x="564" y="108" text-anchor="end">replay:&lt;session&gt;</text>

  <rect class="stream" x="356" y="128" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="156" text-anchor="middle">ReplayWake</text>
  <text class="node-subtitle" x="460" y="175" text-anchor="middle">Streamsy.wake</text>

  <rect class="node" x="356" y="244" width="208" height="156" rx="14"/>
  <text class="node-title" x="460" y="270" text-anchor="middle">replayStats</text>
  <text class="node-subtitle" x="460" y="289" text-anchor="middle">Projection.mapAccumBatch</text>
  <text class="node-subtitle" x="460" y="305" text-anchor="middle">Commit.producer</text>
  <rect class="host" x="368" y="322" width="184" height="64" rx="10"/>
  <text class="inner-title" x="460" y="348" text-anchor="middle">Headless engine</text>
  <text class="node-subtitle" x="460" y="367" text-anchor="middle">WASM · rebuilt from tic 0</text>

  <rect class="table" x="356" y="436" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="464" text-anchor="middle">server_snapshots</text>
  <text class="node-subtitle" x="460" y="483" text-anchor="middle">gzip heap · every 21,000 tics</text>
  <path class="flow" d="M 460 402 V 430"/>

  <!-- DoomLobby: one object for all sessions -->
  <rect class="group" x="660" y="204" width="240" height="220" rx="18"/>
  <text class="group-label" x="676" y="228">DOOMLOBBY</text>
  <text class="owner" x="884" y="228" text-anchor="end">lobby:v2</text>

  <rect class="stream" x="676" y="244" width="208" height="64" rx="14"/>
  <text class="node-title" x="780" y="272" text-anchor="middle">Scores</text>
  <text class="node-subtitle" x="780" y="291" text-anchor="middle">state · stats, public read</text>

  <rect class="stream" x="676" y="336" width="208" height="64" rx="14"/>
  <text class="node-title" x="780" y="364" text-anchor="middle">LobbyStream</text>
  <text class="node-subtitle" x="780" y="383" text-anchor="middle">state · session metadata</text>

  <!-- Object-to-object flows over internal links -->
  <path class="trigger" d="M 140 236 V 198"/>
  <text class="flow-label" x="148" y="221">on append</text>
  <path class="trigger" d="M 246 160 H 350"/>
  <text class="flow-label" x="300" y="152" text-anchor="middle">/__wake</text>
  <text class="flow-label" x="300" y="176" text-anchor="middle">append</text>
  <path class="trigger" d="M 460 194 V 238"/>
  <text class="flow-label" x="468" y="221">alarm</text>
  <path class="flow" d="M 252 276 H 350"/>
  <text class="flow-label" x="300" y="268" text-anchor="middle">/__frames</text>
  <text class="flow-label" x="300" y="292" text-anchor="middle">read</text>
  <path class="flow" d="M 566 276 H 670"/>
  <text class="flow-label" x="620" y="268" text-anchor="middle">/__scores</text>
  <text class="flow-label" x="620" y="292" text-anchor="middle">append</text>


  <!-- Browser -->
  <rect class="group" x="20" y="658" width="880" height="120" rx="18"/>
  <text class="group-label" x="36" y="680">BROWSER</text>

  <rect class="node" x="36" y="696" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="724" text-anchor="middle">Play</text>
  <text class="node-subtitle" x="140" y="743" text-anchor="middle">WASM engine, 35 tics/s</text>

  <rect class="node" x="356" y="696" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="724" text-anchor="middle">Watch</text>
  <text class="node-subtitle" x="460" y="743" text-anchor="middle">seek, fork, stats HUD</text>

  <rect class="node" x="676" y="696" width="208" height="64" rx="14"/>
  <text class="node-title" x="780" y="724" text-anchor="middle">Lobby</text>
  <text class="node-subtitle" x="780" y="743" text-anchor="middle">sessions joined with stats</text>

  <!-- Browser flows through the Worker -->
  <path class="flow" d="M 140 694 V 430"/>
  <text class="flow-label" x="132" y="620" text-anchor="end">input batches</text>
  <path class="both" d="M 215 430 V 638 H 400 V 690"/>
  <text class="flow-label" x="307" y="630" text-anchor="middle">frames, fork</text>
  <path class="flow" d="M 460 502 V 690"/>
  <text class="flow-label" x="468" y="620">snapshots</text>
  <text class="flow-label" x="468" y="634">GET</text>
  <path class="flow" d="M 690 426 V 638 H 524 V 690"/>
  <text class="flow-label" x="607" y="630" text-anchor="middle">scores</text>
  <path class="flow" d="M 735 426 V 690"/>
  <text class="flow-label" x="743" y="620">WebSocket</text>
  <path class="flow" d="M 830 694 V 430"/>
  <text class="flow-label" x="838" y="620">metadata</text>

  <!-- Public Worker, drawn over the request arrows that pass through it -->
  <rect class="host" x="20" y="548" width="880" height="44" rx="14"/>
  <text class="node-title" x="460" y="567" text-anchor="middle">Cloudflare Worker</text>
  <text class="node-subtitle" x="460" y="584" text-anchor="middle">routes /doom/v2/* with Placement.byRoute · snapshot reads → replay:&lt;session&gt; · /__* → 404</text>

  <!-- Step badges: each number is also a section number on the page -->
  <circle class="badge" cx="36" cy="244" r="11"/><text class="step" x="36" y="248" text-anchor="middle">1</text>
  <circle class="badge" cx="250" cy="238" r="11"/><text class="step" x="250" y="242" text-anchor="middle">2</text>
  <circle class="badge" cx="260" cy="84" r="11"/><text class="step" x="260" y="88" text-anchor="middle">3</text>
  <circle class="badge" cx="244" cy="128" r="11"/><text class="step" x="244" y="132" text-anchor="middle">4</text>
  <circle class="badge" cx="564" cy="244" r="11"/><text class="step" x="564" y="248" text-anchor="middle">5</text>
  <circle class="badge" cx="564" cy="436" r="11"/><text class="step" x="564" y="440" text-anchor="middle">6</text>
  <circle class="badge" cx="900" cy="204" r="11"/><text class="step" x="900" y="208" text-anchor="middle">7</text>

  <text class="legend" x="24" y="818">1. Binary streams hold the input history</text>
  <text class="legend" x="470" y="818">2. Native forks branch inside a batch</text>
  <text class="legend" x="24" y="840">3. Placement keeps native forks in one object</text>
  <text class="legend" x="470" y="840">4. Wake streams connect independent owners</text>
  <text class="legend" x="24" y="862">5. A checkpointed projection computes stats with the engine</text>
  <text class="legend" x="470" y="862">6. The replay object keeps snapshots in SQLite</text>
  <text class="legend" x="24" y="884">7. State streams deliver the live lobby</text>
</svg>

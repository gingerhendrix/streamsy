<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 512" width="920" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Doom on streams</title>
  <desc id="desc">The player's browser runs the Doom engine and appends each tic's input to an input stream. A watcher's browser reads the same input stream and steps its own Doom engine with those inputs, which produces the same game. The server replays the same input stream and saves a snapshot of engine memory every ten minutes of play. A watcher rewinds by restoring a snapshot and replaying the inputs after it. A fork creates a new stream that shares the input history up to a chosen tic without copying it. Another player appends new inputs to the forked stream.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .trigger { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Doom on streams</text>
  <text class="caption" x="24" y="60">Only inputs travel. Every browser runs its own engine and reaches the same game.</text>

  <!-- Player -->
  <rect class="group" x="20" y="200" width="240" height="124" rx="18"/>
  <text class="group-label" x="36" y="224">PLAYER'S BROWSER</text>
  <rect class="node" x="36" y="240" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="268" text-anchor="middle">Doom engine</text>
  <text class="node-subtitle" x="140" y="287" text-anchor="middle">WASM · 35 tics a second</text>

  <!-- Streams -->
  <rect class="node" x="356" y="124" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="152" text-anchor="middle">Snapshots</text>
  <text class="node-subtitle" x="460" y="171" text-anchor="middle">engine memory, server-made</text>

  <rect class="stream" x="356" y="240" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="268" text-anchor="middle">Input stream</text>
  <text class="node-subtitle" x="460" y="287" text-anchor="middle">9 bytes for each tic</text>

  <rect class="stream" x="356" y="400" width="208" height="64" rx="14"/>
  <text class="node-title" x="460" y="428" text-anchor="middle">Forked stream</text>
  <text class="node-subtitle" x="460" y="447" text-anchor="middle">shares history to tic N</text>

  <!-- Watcher -->
  <rect class="group" x="660" y="84" width="240" height="240" rx="18"/>
  <text class="group-label" x="676" y="108">WATCHER'S BROWSER</text>
  <rect class="node" x="676" y="124" width="208" height="180" rx="14"/>
  <text class="node-title" x="780" y="210" text-anchor="middle">Doom engine</text>
  <text class="node-subtitle" x="780" y="229" text-anchor="middle">same inputs, same game</text>

  <!-- Fork player -->
  <rect class="group" x="20" y="360" width="240" height="124" rx="18"/>
  <text class="group-label" x="36" y="384">ANOTHER PLAYER</text>
  <rect class="node" x="36" y="400" width="208" height="64" rx="14"/>
  <text class="node-title" x="140" y="428" text-anchor="middle">Doom engine</text>
  <text class="node-subtitle" x="140" y="447" text-anchor="middle">plays a different future</text>

  <!-- Flows -->
  <path class="flow" d="M 460 238 V 194"/>
  <text class="flow-label" x="476" y="214">server replays</text>
  <text class="flow-label" x="476" y="228">every 10 min</text>
  <path class="flow" d="M 246 272 H 350"/>
  <text class="flow-label" x="300" y="264" text-anchor="middle">inputs</text>
  <text class="flow-label" x="300" y="290" text-anchor="middle">append</text>

  <path class="flow" d="M 566 156 H 670"/>
  <text class="flow-label" x="618" y="148" text-anchor="middle">rewind</text>
  <text class="flow-label" x="618" y="174" text-anchor="middle">restore</text>
  <path class="flow" d="M 566 272 H 670"/>
  <text class="flow-label" x="612" y="264" text-anchor="middle">follow live</text>
  <text class="flow-label" x="612" y="290" text-anchor="middle">or replay</text>

  <path class="trigger" d="M 460 306 V 394"/>
  <text class="flow-label" x="468" y="354">fork at tic N</text>
  <path class="flow" d="M 246 432 H 350"/>
  <text class="flow-label" x="294" y="424" text-anchor="middle">new inputs</text>

  <!-- Key -->
  <rect class="stream" x="676" y="403" width="30" height="14" rx="4"/>
  <text class="legend" x="718" y="414">Durable stream</text>
  <path class="flow" d="M 676 434 H 700"/>
  <text class="legend" x="718" y="438">Bytes</text>
  <path class="trigger" d="M 676 458 H 700"/>
  <text class="legend" x="718" y="462">Fork, nothing copied</text>
</svg>

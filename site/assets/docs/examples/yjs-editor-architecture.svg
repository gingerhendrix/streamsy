<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 724" width="920" height="724" role="img" aria-labelledby="title desc">
  <title id="title">Yjs editor on Cloudflare architecture</title>
  <desc id="desc">The browser runs a ProseMirror editor bound to a Yjs document and YjsProvider. The page also links each room's raw update stream. A Cloudflare Worker sends every /v1/yjs document request to the DocumentObject named after the document, and sends /v1/stream requests through a Streamsy router that uses the same placement. One DocumentObject owns every stream of its document. Its HttpRouter Yjs routes forward document reads and appends to the .updates stream and awareness requests to the .awareness streams. They read the compaction fold's state to discover the latest snapshot and to refuse writes past the document budget. Http.routes serves all four streams read-only. Each commit to .updates marks the compaction fold, and the object's alarm runs it. The fold keeps a small checkpoint of byte counts and the snapshot offset, and when enough new bytes arrive it publishes a snapshot stream stored as 1 MiB messages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .owner { fill: #94a3b8; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .inner-title { fill: #f8fafc; font: 700 14px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .table { fill: #4b4561; stroke: #a59cc4; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .both { fill: none; stroke: #64748b; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .trigger { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Yjs editor on Cloudflare</text>
  <text class="caption" x="24" y="60">Every stream of a document lives in one object. Its alarm compacts the log off the request path.</text>

  <!-- Browser -->
  <rect class="group" x="20" y="84" width="880" height="104" rx="18"/>
  <text class="group-label" x="36" y="108">BROWSER</text>

  <rect class="node" x="36" y="116" width="260" height="56" rx="14"/>
  <text class="node-title" x="166" y="140" text-anchor="middle">Editor</text>
  <text class="node-subtitle" x="166" y="158" text-anchor="middle">ProseMirror · y-prosemirror</text>

  <rect class="node" x="330" y="116" width="260" height="56" rx="14"/>
  <text class="node-title" x="460" y="140" text-anchor="middle">YjsProvider</text>
  <text class="node-subtitle" x="460" y="158" text-anchor="middle">YjsProvider</text>

  <rect class="node" x="624" y="116" width="260" height="56" rx="14"/>
  <text class="node-title" x="754" y="140" text-anchor="middle">Raw stream link</text>
  <text class="node-subtitle" x="754" y="158" text-anchor="middle">.updates?offset=-1 · curl</text>

  <!-- Requests -->
  <path class="both" d="M 460 180 V 254"/>
  <text class="flow-label" x="470" y="214">/v1/yjs/editor/docs/:room</text>
  <path class="flow" d="M 754 180 V 254"/>
  <text class="flow-label" x="764" y="214">/v1/stream/…</text>

  <!-- Worker -->
  <rect class="host" x="20" y="260" width="880" height="64" rx="14"/>
  <text class="node-title" x="460" y="287" text-anchor="middle">Worker</text>
  <text class="node-subtitle" x="460" y="306" text-anchor="middle">document → DOCUMENTS.idFromName(document) · /v1/stream → router(placement)</text>

  <path class="flow" d="M 460 328 V 354"/>
  <text class="flow-label" x="470" y="346">stub.fetch</text>

  <!-- DocumentObject -->
  <rect class="group" x="20" y="360" width="880" height="296" rx="18"/>
  <text class="group-label" x="36" y="384">DOCUMENTOBJECT</text>
  <text class="owner" x="884" y="384" text-anchor="end">yjs/&lt;service&gt;/docs/&lt;path&gt;</text>

  <rect class="node" x="36" y="400" width="260" height="150" rx="14"/>
  <text class="node-title" x="166" y="426" text-anchor="middle">Yjs routes</text>
  <text class="node-subtitle" x="166" y="445" text-anchor="middle">HttpRouter · /v1/yjs/*</text>
  <rect class="host" x="50" y="464" width="232" height="70" rx="10"/>
  <text class="inner-title" x="166" y="490" text-anchor="middle">Discovery and budget</text>
  <text class="node-subtitle" x="166" y="509" text-anchor="middle">Projection.read(compaction)</text>

  <rect class="node" x="36" y="572" width="260" height="64" rx="14"/>
  <text class="node-title" x="166" y="599" text-anchor="middle">Http.routes</text>
  <text class="node-subtitle" x="166" y="618" text-anchor="middle">4 streams · access: "read"</text>

  <rect class="stream" x="330" y="400" width="260" height="64" rx="14"/>
  <text class="node-title" x="460" y="428" text-anchor="middle">.updates</text>
  <text class="node-subtitle" x="460" y="447" text-anchor="middle">bytes · lib0-framed updates</text>

  <rect class="stream" x="330" y="486" width="260" height="64" rx="14"/>
  <text class="node-title" x="460" y="514" text-anchor="middle">.awareness/&lt;name&gt;</text>
  <text class="node-subtitle" x="460" y="533" text-anchor="middle">bytes · Stream-TTL 3600</text>

  <rect class="stream" x="330" y="572" width="260" height="64" rx="14"/>
  <text class="node-title" x="460" y="600" text-anchor="middle">.awareness-index</text>
  <text class="node-subtitle" x="460" y="619" text-anchor="middle">json · named awareness</text>

  <rect class="node" x="624" y="400" width="260" height="150" rx="14"/>
  <text class="node-title" x="754" y="426" text-anchor="middle">compaction</text>
  <text class="node-subtitle" x="754" y="445" text-anchor="middle">Projection.fold · Commit.transaction</text>
  <rect class="table" x="638" y="464" width="232" height="70" rx="10"/>
  <text class="inner-title" x="754" y="490" text-anchor="middle">Fold checkpoint</text>
  <text class="node-subtitle" x="754" y="509" text-anchor="middle">bytes · pending · snapshot</text>

  <rect class="stream" x="624" y="572" width="260" height="64" rx="14"/>
  <text class="node-title" x="754" y="600" text-anchor="middle">.snapshots/&lt;offset&gt;_snapshot</text>
  <text class="node-subtitle" x="754" y="619" text-anchor="middle">bytes · 1 MiB messages</text>

  <!-- Object flows -->
  <path class="flow" d="M 298 432 H 324"/>
  <path class="flow" d="M 298 518 H 324"/>
  <path class="flow" d="M 298 604 H 324"/>
  <path class="trigger" d="M 592 432 H 618"/>
  <text class="flow-label" x="608" y="480" text-anchor="middle">alarm</text>
  <path class="flow" d="M 754 552 V 566"/>

  <!-- Step badges: each number is also a section number on the page -->
  <circle class="badge" cx="330" cy="400" r="11"/><text class="step" x="330" y="404" text-anchor="middle">1</text>
  <circle class="badge" cx="20" cy="260" r="11"/><text class="step" x="20" y="264" text-anchor="middle">2</text>
  <circle class="badge" cx="20" cy="360" r="11"/><text class="step" x="20" y="364" text-anchor="middle">3</text>
  <circle class="badge" cx="36" cy="400" r="11"/><text class="step" x="36" y="404" text-anchor="middle">4</text>
  <circle class="badge" cx="624" cy="400" r="11"/><text class="step" x="624" y="404" text-anchor="middle">5</text>
  <circle class="badge" cx="624" cy="572" r="11"/><text class="step" x="624" y="576" text-anchor="middle">6</text>
  <circle class="badge" cx="50" cy="464" r="11"/><text class="step" x="50" y="468" text-anchor="middle">7</text>
  <circle class="badge" cx="330" cy="116" r="11"/><text class="step" x="330" y="120" text-anchor="middle">8</text>

  <!-- Key -->
  <rect class="stream" x="36" y="680" width="30" height="14" rx="4"/>
  <text class="legend" x="78" y="691">Streamsy stream</text>
  <path class="flow" d="M 236 687 H 260"/>
  <text class="legend" x="278" y="691">Request or write</text>
  <path class="trigger" d="M 436 687 H 460"/>
  <text class="legend" x="478" y="691">Wakeup</text>
  <rect class="table" x="576" y="680" width="30" height="14" rx="4"/>
  <text class="legend" x="618" y="691">Projection checkpoint</text>
</svg>

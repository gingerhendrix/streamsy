<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Hex board architecture</title>
  <desc id="desc">A test runtime appends game events to the GameEvents stream. The board projection folds each event into the board state. The SQLite host commits the state row and the checkpoint in one transaction. Projection.read returns the state and the offsets. A restarted runtime on the same file finds no new items and the same state, then resumes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .flow-label { fill: #64748b; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Hex board</text>
  <text class="caption" x="24" y="60">The whole board is fold state. It commits with the checkpoint. The teal box is the Streamsy stream.</text>

  <rect class="group" x="20" y="80" width="880" height="270" rx="18"/>
  <text class="group-label" x="36" y="100">TEST RUNTIMES, ONE SQLITE FILE</text>

  <rect class="node" x="40" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="130" y="150" text-anchor="middle">Test runtime</text>
  <text class="node-subtitle" x="130" y="170" text-anchor="middle">append, run, read</text>

  <rect class="stream" x="260" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="350" y="150" text-anchor="middle">GameEvents</text>
  <text class="node-subtitle" x="350" y="170" text-anchor="middle">games/:gameId/events</text>

  <rect class="node" x="480" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="570" y="150" text-anchor="middle">board</text>
  <text class="node-subtitle" x="570" y="170" text-anchor="middle">fold: stepBoard</text>

  <rect class="host" x="700" y="110" width="180" height="90" rx="14"/>
  <text class="node-title" x="790" y="150" text-anchor="middle">SQLite file</text>
  <text class="node-subtitle" x="790" y="170" text-anchor="middle">state + checkpoint</text>

  <rect class="node" x="700" y="250" width="180" height="80" rx="14"/>
  <text class="node-title" x="790" y="285" text-anchor="middle">Restarted runtime</text>
  <text class="node-subtitle" x="790" y="305" text-anchor="middle">0 new items, resume</text>

  <path class="flow" d="M 222 155 H 256"/>
  <path class="flow" d="M 442 155 H 476"/>
  <path class="flow" d="M 662 155 H 696"/>
  <path class="flow" d="M 740 202 V 228 H 130 V 206"/>
  <text class="flow-label" x="420" y="246" text-anchor="middle">Projection.read</text>
  <path class="flow" d="M 840 202 V 246"/>

  <!-- Step badges: each number is also a section number -->
  <circle class="badge" cx="440" cy="110" r="11"/><text class="step" x="440" y="114" text-anchor="middle">1</text>
  <circle class="badge" cx="660" cy="110" r="11"/><text class="step" x="660" y="114" text-anchor="middle">2</text>
  <circle class="badge" cx="880" cy="110" r="11"/><text class="step" x="880" y="114" text-anchor="middle">3</text>
  <circle class="badge" cx="300" cy="228" r="11"/><text class="step" x="300" y="232" text-anchor="middle">4</text>
  <circle class="badge" cx="880" cy="250" r="11"/><text class="step" x="880" y="254" text-anchor="middle">5</text>

  <text class="legend" x="24" y="380">1. Declare the game event stream</text>
  <text class="legend" x="318" y="380">2. Fold each event into the board</text>
  <text class="legend" x="612" y="380">3. Commit state with the checkpoint</text>
  <text class="legend" x="24" y="402">4. Run and read the board</text>
  <text class="legend" x="318" y="402">5. Restart and resume</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Hacker News newest demo architecture</title>
  <desc id="desc">One Durable State stream, hackernews/newest, holds the story changes. An atomic projection, newestRows, folds the stream into rows. The poller fetches Hacker News, runs and reads the projection, diffs the rows against the fetch and appends the changes with expectedOffset. On OffsetMismatch it retries the pass up to three times. Serve.state publishes the stream at /state/newest. In the browser, createStreamDB replays the stream into TanStack DB and React renders it with useLiveQuery. The stream, the checkpoint and the state row share one Bun SQLite file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { fill: #64748b; font: 700 18px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; }
      .caption { fill: #64748b; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
      .group-label { fill: #94a3b8; font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .node-title { fill: #f8fafc; font: 700 16px ui-sans-serif, system-ui, sans-serif; }
      .node-subtitle { fill: #e2e8f0; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .edge-label { fill: #94a3b8; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step { fill: #f8fafc; font: 700 12px ui-sans-serif, system-ui, sans-serif; }
      .legend { fill: #64748b; font: 500 12px ui-sans-serif, system-ui, sans-serif; }
      .group { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #3f4756; stroke: #94a3b8; stroke-width: 1.5; }
      .stream { fill: #416f68; stroke: #83b8ad; stroke-width: 1.5; }
      .external { fill: #8a5a44; stroke: #d6a184; stroke-width: 1.5; }
      .host { fill: #2f3642; stroke: #64748b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .badge { fill: #0f172a; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="heading" x="24" y="38">Hacker News newest</text>
  <text class="caption" x="24" y="60">Fold, read, decide, append, serve, follow. The teal box is the one Streamsy stream. Numbers match the page sections.</text>

  <!-- Server group -->
  <rect class="group" x="172" y="84" width="784" height="356" rx="18"/>
  <text class="group-label" x="188" y="106">BUN SERVER</text>

  <!-- Row 1 -->
  <rect class="external" x="24" y="150" width="120" height="84" rx="14"/>
  <text class="node-title" x="84" y="186" text-anchor="middle">HN API</text>
  <text class="node-subtitle" x="84" y="206" text-anchor="middle">ids and items</text>

  <rect class="node" x="208" y="150" width="180" height="84" rx="14"/>
  <text class="node-title" x="298" y="186" text-anchor="middle">Poller</text>
  <text class="node-subtitle" x="298" y="206" text-anchor="middle">reconcileNewest</text>

  <rect class="stream" x="468" y="150" width="200" height="84" rx="14"/>
  <text class="node-title" x="568" y="186" text-anchor="middle">HackerNewsStories</text>
  <text class="node-subtitle" x="568" y="206" text-anchor="middle">hackernews/newest</text>

  <rect class="node" x="748" y="150" width="180" height="84" rx="14"/>
  <text class="node-title" x="838" y="186" text-anchor="middle">Serve.state</text>
  <text class="node-subtitle" x="838" y="206" text-anchor="middle">/state/newest</text>

  <!-- Retry loop on the poller -->
  <path class="flow" d="M 256 148 C 256 116, 340 116, 340 146"/>

  <path class="flow" d="M 146 192 H 204"/>
  <path class="flow" d="M 390 192 H 464"/>
  <text class="edge-label" x="428" y="216" text-anchor="middle">append</text>
  <path class="flow" d="M 670 192 H 744"/>

  <!-- Row 2 -->
  <rect class="node" x="468" y="276" width="200" height="84" rx="14"/>
  <text class="node-title" x="568" y="312" text-anchor="middle">newestRows</text>
  <text class="node-subtitle" x="568" y="332" text-anchor="middle">Projection.atomic</text>

  <path class="flow" d="M 568 236 V 272"/>
  <path class="flow" d="M 466 318 H 298 V 238"/>
  <text class="edge-label" x="382" y="308" text-anchor="middle">run, read rows + offset</text>

  <rect class="host" x="208" y="380" width="460" height="42" rx="12"/>
  <text class="node-subtitle" x="438" y="406" text-anchor="middle">One Bun SQLite file: stream · checkpoint · state row</text>

  <!-- Browser group -->
  <rect class="group" x="172" y="470" width="784" height="130" rx="18"/>
  <text class="group-label" x="188" y="492">BROWSER</text>

  <rect class="node" x="208" y="505" width="180" height="80" rx="14"/>
  <text class="node-title" x="298" y="539" text-anchor="middle">React</text>
  <text class="node-subtitle" x="298" y="559" text-anchor="middle">useLiveQuery</text>

  <rect class="node" x="468" y="505" width="200" height="80" rx="14"/>
  <text class="node-title" x="568" y="539" text-anchor="middle">TanStack DB</text>
  <text class="node-subtitle" x="568" y="559" text-anchor="middle">stories collection</text>

  <rect class="node" x="748" y="505" width="180" height="80" rx="14"/>
  <text class="node-title" x="838" y="539" text-anchor="middle">createStreamDB</text>
  <text class="node-subtitle" x="838" y="559" text-anchor="middle">offset -1, then live</text>

  <path class="flow" d="M 838 236 V 501"/>
  <path class="flow" d="M 746 545 H 672"/>
  <path class="flow" d="M 466 545 H 392"/>

  <!-- Step badges: each number is a page section -->
  <circle class="badge" cx="656" cy="150" r="11"/><text class="step" x="656" y="154" text-anchor="middle">1</text>
  <circle class="badge" cx="592" cy="254" r="11"/><text class="step" x="592" y="258" text-anchor="middle">2</text>
  <circle class="badge" cx="428" cy="170" r="11"/><text class="step" x="428" y="174" text-anchor="middle">3</text>
  <circle class="badge" cx="298" cy="112" r="11"/><text class="step" x="298" y="116" text-anchor="middle">4</text>
  <circle class="badge" cx="708" cy="170" r="11"/><text class="step" x="708" y="174" text-anchor="middle">5</text>
  <circle class="badge" cx="862" cy="455" r="11"/><text class="step" x="862" y="459" text-anchor="middle">6</text>

  <text class="legend" x="24" y="636">1. Declare and host the stream</text>
  <text class="legend" x="340" y="636">2. Fold the stream into rows</text>
  <text class="legend" x="656" y="636">3. Read, decide, append</text>
  <text class="legend" x="24" y="658">4. Retry on OffsetMismatch</text>
  <text class="legend" x="340" y="658">5. Serve the stream as State</text>
  <text class="legend" x="656" y="658">6. Replay from -1, then follow live</text>
</svg>

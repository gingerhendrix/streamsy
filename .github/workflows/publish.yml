name: Publish to npm

# A `v*` tag runs the full gate, publishes the packages and creates the
# GitHub release. A manual run (workflow_dispatch) runs the same gate on the
# chosen branch and skips every step that publishes, so the gate can be
# checked before a tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@11.11.0

      - run: bun install --frozen-lockfile

      - name: Install site and e2e dependencies
        run: |
          bun install --frozen-lockfile --cwd site
          bun install --frozen-lockfile --cwd e2e

      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run format:check

      - run: bun run test:unit

      # The conformance steps match ci.yml. The workerd script retries a known
      # transient failure twice before it reports.
      - run: bun run test:conformance:memory

      - run: bun run --cwd packages/conformance-tests test:memory:wildcard

      - run: bun run test:conformance:sqlite

      - run: bun run test:conformance:remote

      - run: bun run test:conformance:workerd

      - name: E2E package checks
        run: bun run e2e:check

      - name: Package dry runs
        run: bun run pack:dry-run

      - name: Read version from root package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify tag and package versions match root package.json
        if: env.IS_RELEASE == 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Error: tag $GITHUB_REF_NAME but root package.json has version $VERSION" >&2
            exit 1
          fi

          PACKAGES=(
            packages/core
            packages/storage
            packages/projection
            packages/serve
          )

          for pkg in "${PACKAGES[@]}"; do
            PKG_NAME=$(node -p "require('./${pkg}/package.json').name")
            PKG_VERSION=$(node -p "require('./${pkg}/package.json').version")
            if [[ "$PKG_VERSION" != "$VERSION" ]]; then
              echo "Error: root package.json has version $VERSION but $PKG_NAME has version $PKG_VERSION" >&2
              exit 1
            fi
          done

      - name: Pack and publish packages
        if: env.IS_RELEASE == 'true'
        run: |
          # Dependency order: storage, projection and serve depend on core.
          PACKAGES=(
            packages/core
            packages/storage
            packages/projection
            packages/serve
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing $pkg..."
            cd "$pkg"

            # Skip if already published (partial-publish recovery)
            PKG_NAME=$(node -p "require('./package.json').name")
            if npm view "$PKG_NAME@$VERSION" version &>/dev/null; then
              echo "  $PKG_NAME@$VERSION already published, skipping"
              cd "$GITHUB_WORKSPACE"
              continue
            fi

            bun pm pack --quiet
            TARBALL=$(ls *.tgz)
            npm publish "$TARBALL" --provenance --access public
            rm -f "$TARBALL"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

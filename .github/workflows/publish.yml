name: Release

# Every push to main runs the full gate, then `tegami ci`. When .tegami/ holds
# release notes, Tegami opens or updates the Version Packages pull request.
# When that pull request merges, Tegami publishes the four public packages
# through npm trusted publishing, creates the shared v<version> tag and the
# GitHub release. A manual run (workflow_dispatch) does the same on main.
#
# Keep the file name publish.yml: npm trusted publishing is tied to it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Tegami needs Node 24.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.11.0

      - run: bun install --frozen-lockfile

      - name: Install site and e2e dependencies
        run: |
          bun install --frozen-lockfile --cwd site
          bun install --frozen-lockfile --cwd e2e

      - run: bun run build

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run format:check

      - run: bun run test:unit

      # The conformance steps match ci.yml. The workerd script retries a known
      # transient failure twice before it reports.
      - run: bun run test:conformance:memory

      - run: bun run --cwd packages/conformance-tests test:memory:wildcard

      - run: bun run test:conformance:sqlite

      - run: bun run test:conformance:remote

      - run: bun run test:conformance:workerd

      - name: E2E package checks
        run: bun run e2e:check

      - name: Package dry runs
        run: bun run pack:dry-run

      - name: Version or publish packages
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

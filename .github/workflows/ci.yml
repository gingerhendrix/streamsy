name: CI

on:
  push:
    branches: [main, effect]
  pull_request:
    branches: [main, effect]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install site and hosted dependencies
        run: |
          bun install --frozen-lockfile --cwd site
          bun install --frozen-lockfile --cwd hosted

      - name: Typecheck
        run: bun run typecheck

      - name: Lint policy split
        run: bun run lint:policy

      - name: Lint (general policy)
        run: bun run lint:general

      - name: Lint (Effect policy)
        run: bun run lint:effect

      - name: Format check
        run: bun run format:check

      - name: Build publishable packages
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Memory conformance tests
        run: bun run test:conformance:memory

      - name: SQLite conformance tests
        run: bun run test:conformance:sqlite

      - name: Fetch conformance tests
        run: bun run test:conformance:fetch

      - name: Perimeter
        run: bun run check:perimeter

      - name: Package dry runs
        run: bun run pack:dry-run

  # The workerd profile runs the upstream conformance suite against Miniflare.
  # It has a known transient socket-close failure on one producer-header case
  # (review items L8 and T3). It runs as its own job so a flake is visible on
  # its own line and does not mask the rest of the gate. The script retries
  # failed cases twice before reporting.
  workerd:
    name: Conformance (workerd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install site and hosted dependencies
        run: |
          bun install --frozen-lockfile --cwd site
          bun install --frozen-lockfile --cwd hosted

      - name: Build publishable packages
        run: bun run build

      - name: Workerd conformance tests
        run: bun run test:conformance:workerd

      - name: Workerd harness ownership tests
        run: bun run test:conformance:ownership

      - name: Hosted Durable Object host checks
        run: bun run hosted:check
